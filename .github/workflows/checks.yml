name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc desktop/ReZme.swift -o /tmp/reZme -target "$(uname -m)-apple-macos14.0" -framework SwiftUI -framework AppKit -parse-as-library
      - run: bash -n Instalar.command
